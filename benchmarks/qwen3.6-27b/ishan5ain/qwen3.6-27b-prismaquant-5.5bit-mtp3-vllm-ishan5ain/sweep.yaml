      \ MXFP8 (high-sensitivity dense), or BF16\\n(most-sensitive\\\n    \\ Linears\
      \ + embed + norms). Selected as the Pareto knee of the\\n\\u0394loss-vs-bpp\\\
      \n    \\ curve (Kneedle algorithm): below 5.5 bpp the loss curve\\nsteepens\
      \ sharply, above\\\n    \\ 5.5 bpp the marginal gain per bit diminishes.\\n\\\
