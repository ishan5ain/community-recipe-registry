recipe_version: "2"
model: unsloth/Qwen3.6-27B-NVFP4
runtime: vllm
container: ghcr.io/spark-arena/dgx-vllm-eugr-nightly:latest

metadata:
  description: |
    Qwen3.6-27B NVFP4 with MTP (Multi-Token Prediction) speculative decoding
    on DGX Spark GB10. Qwen3.6's built-in MTP heads share embeddings with the
    main model (~0.79 GiB overhead). On GB10's unified memory, MTP provides
    ~8-24% throughput gain depending on concurrency: moderate for single-user,
    best at 8-16 concurrent requests where it fills idle compute behind the
    memory-bandwidth bottleneck. At 16 concurrent, benefit is +24% tok/s and
    -56% TTFT vs vanilla.
  maintainer: "@ishan5ain"
  model_params: 27B
  model_dtype: nvfp4
  kv_dtype: fp8
  quantization: nvfp4
  quant_bits: 4

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  pipeline_parallel: 1
  gpu_memory_utilization: 0.8
  dtype: bfloat16
  kv_cache_dtype: fp8
  max_model_len: 32768
  max_num_batched_tokens: 32768
  max_num_seqs: 8
  attention_backend: flashinfer
  tool_call_parser: qwen3_coder
  reasoning_parser: qwen3
  speculative_config: '{"method":"mtp","num_speculative_tokens":2}'

env:
  VLLM_MARLIN_USE_ATOMIC_ADD: "1"

command: |
  vllm serve {model} \
    --host {host} \
    --port {port} \
    --tensor-parallel-size {tensor_parallel} \
    --pipeline-parallel-size {pipeline_parallel} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --dtype {dtype} \
    --kv-cache-dtype {kv_cache_dtype} \
    --max-model-len {max_model_len} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --max-num-seqs {max_num_seqs} \
    --trust-remote-code \
    --enable-auto-tool-choice \
    --tool-call-parser {tool_call_parser} \
    --reasoning-parser {reasoning_parser} \
    --attention-backend {attention_backend} \
    --enable-prefix-caching \
    --speculative-config '{speculative_config}' \
    --seed 0
