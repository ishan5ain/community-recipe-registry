recipe_version: "2"
model: unsloth/Qwen3.6-27B-NVFP4
runtime: vllm
container: ghcr.io/spark-arena/dgx-vllm-eugr-nightly:latest

metadata:
  description: |
    Qwen3.6-27B in NVFP4 (NVIDIA 4-bit FP) format on DGX Spark GB10.
    NVFP4 is Blackwell's native 4-bit floating-point quantization — the weights
    are 4-bit FP (shared exponent, compact mantissa) while activations run in
    bfloat16. Model size ~13.5 GB vs ~27 GB for FP8, leaving more room for the
    KV cache and longer context.
  maintainer: "@ishan5ain"
  model_params: 27B
  model_dtype: nvfp4
  kv_dtype: fp8
  quantization: nvfp4
  quant_bits: 4

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  pipeline_parallel: 1
  gpu_memory_utilization: 0.8
  dtype: bfloat16
  kv_cache_dtype: fp8
  max_model_len: 32768
  max_num_batched_tokens: 32768
  max_num_seqs: 8
  attention_backend: flashinfer
  tool_call_parser: qwen3_coder
  reasoning_parser: qwen3

env:
  VLLM_MARLIN_USE_ATOMIC_ADD: "1"

command: |
  vllm serve {model} \
    --host {host} \
    --port {port} \
    --tensor-parallel-size {tensor_parallel} \
    --pipeline-parallel-size {pipeline_parallel} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --dtype {dtype} \
    --kv-cache-dtype {kv_cache_dtype} \
    --max-model-len {max_model_len} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --max-num-seqs {max_num_seqs} \
    --trust-remote-code \
    --enable-auto-tool-choice \
    --tool-call-parser {tool_call_parser} \
    --reasoning-parser {reasoning_parser} \
    --attention-backend {attention_backend} \
    --enable-prefix-caching \
    --seed 0
