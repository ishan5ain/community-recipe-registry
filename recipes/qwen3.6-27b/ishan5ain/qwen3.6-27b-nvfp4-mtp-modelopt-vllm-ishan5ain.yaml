recipe_version: "2"
model: sakamakismile/Qwen3.6-27B-Text-NVFP4-MTP
runtime: vllm
container: ghcr.io/spark-arena/dgx-vllm-eugr-nightly:latest
max_nodes: 1

metadata:
  description: |
    Qwen3.6-27B NVFP4 + MTP via vLLM on DGX Spark GB10.
    Uses sakamakismile/Qwen3.6-27B-Text-NVFP4-MTP — a modelopt-quantized NVFP4
    variant with the MTP head restored in bf16 (unlike compressed-tensors
    exports which drop the MTP head). This should fix the 0% acceptance rate
    seen with unsloth/Qwen3.6-27B-NVFP4 + MTP (Recipe 2).

    Text-only (vision tower stripped). Claimed ~80 tok/s on RTX 5090.
    GB10 (SM 121a) may need VLLM_TEST_FORCE_FP8_MARLIN env var for NVFP4
    backend compatibility with the modelopt format.
  maintainer: "@ishan5ain"
  model_params: 27B
  model_dtype: nvfp4
  kv_dtype: fp8
  quantization: nvfp4
  quant_bits: 4

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  pipeline_parallel: 1
  gpu_memory_utilization: 0.8
  dtype: bfloat16
  kv_cache_dtype: fp8
  max_model_len: 32768
  max_num_batched_tokens: 32768
  max_num_seqs: 8
  attention_backend: flashinfer
  tool_call_parser: qwen3_coder
  reasoning_parser: qwen3
  speculative_config: '{"method":"mtp","num_speculative_tokens":2}'
  served_model_name: qwen3.6-nvfp4-mtp

env:
  VLLM_MARLIN_USE_ATOMIC_ADD: "1"
  VLLM_TEST_FORCE_FP8_MARLIN: "1"
  # Persist triton/torch compile caches across container launches
  # (sparkrun mounts ~/.cache/huggingface -> /cache/huggingface)
  XDG_CACHE_HOME: /cache/huggingface

command: |
  vllm serve {model} \
    --host {host} \
    --port {port} \
    --tensor-parallel-size {tensor_parallel} \
    --pipeline-parallel-size {pipeline_parallel} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --dtype {dtype} \
    --kv-cache-dtype {kv_cache_dtype} \
    --max-model-len {max_model_len} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --max-num-seqs {max_num_seqs} \
    --trust-remote-code \
    --enable-auto-tool-choice \
    --tool-call-parser {tool_call_parser} \
    --reasoning-parser {reasoning_parser} \
    --attention-backend {attention_backend} \
    --enable-prefix-caching \
    --speculative-config '{speculative_config}' \
    --served-model-name {served_model_name} \
    --language-model-only \
    --seed 0
