recipe_version: "2"
model: sakamakismile/Qwen3.6-27B-Text-NVFP4-MTP
runtime: vllm
container: ghcr.io/spark-arena/dgx-vllm-eugr-nightly:latest
max_nodes: 1

metadata:
  description: |
    Qwen3.6-27B NVFP4 + MTP via vLLM on DGX Spark GB10.
    Uses sakamakismile/Qwen3.6-27B-Text-NVFP4-MTP — modelopt NVFP4 with MTP
    head in bf16 (64-91% acceptance on GB10).

    Configured with official Qwen3.6 precise coding sampling params:
    temp=0.6, top_p=0.95, top_k=20, min_p=0.0, presence_penalty=0.0,
    repetition_penalty=1.0, with thinking mode and preserve_thinking.

    Client should pass these params via API:
      "temperature": 0.6,
      "top_p": 0.95,
      "extra_body": {
        "top_k": 20,
        "chat_template_kwargs": {
          "preserve_thinking": true
        }
      }
  maintainer: "@ishan5ain"
  model_params: 27B
  model_dtype: nvfp4
  kv_dtype: fp8
  quantization: nvfp4
  quant_bits: 4

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  pipeline_parallel: 1
  gpu_memory_utilization: 0.8
  dtype: bfloat16
  kv_cache_dtype: fp8
  max_model_len: 32768
  max_num_batched_tokens: 32768
  max_num_seqs: 8
  attention_backend: flashinfer
  tool_call_parser: qwen3_coder
  reasoning_parser: qwen3
  speculative_config: '{"method":"mtp","num_speculative_tokens":2}'
  served_model_name: qwen3.6-nvfp4-mtp-thinking
  # Qwen3.6 official precise coding defaults (applied server-side where supported)
  temperature: 0.6
  top_p: 0.95
  min_p: 0.0
  seed: 0

env:
  VLLM_MARLIN_USE_ATOMIC_ADD: "1"

command: |
  vllm serve {model} \
    --host {host} \
    --port {port} \
    --tensor-parallel-size {tensor_parallel} \
    --pipeline-parallel-size {pipeline_parallel} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --dtype {dtype} \
    --kv-cache-dtype {kv_cache_dtype} \
    --max-model-len {max_model_len} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --max-num-seqs {max_num_seqs} \
    --trust-remote-code \
    --enable-auto-tool-choice \
    --tool-call-parser {tool_call_parser} \
    --reasoning-parser {reasoning_parser} \
    --attention-backend {attention_backend} \
    --enable-prefix-caching \
    --speculative-config '{speculative_config}' \
    --served-model-name {served_model_name} \
    --language-model-only \
    --seed {seed}
