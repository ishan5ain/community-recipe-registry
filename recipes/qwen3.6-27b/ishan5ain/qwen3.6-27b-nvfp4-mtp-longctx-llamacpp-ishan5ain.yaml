recipe_version: "2"
model: nilayparikh/Qwen3.6-27B-Text-NVFP4-MTP-GGUF:qwen3.6-27b-text-nvfp4-mtp.gguf
runtime: llama-cpp
container: ghcr.io/spark-arena/dgx-llama-cpp:latest
max_nodes: 1

metadata:
    description: |
        Qwen3.6-27B NVFP4 + MTP via llama.cpp on DGX Spark GB10 — Long Context variant.

        Extended version of the base recipe configured for 192K context with YaRN
        RoPE scaling. Optimised for codebase analysis, document reasoning over
        long texts, and extended multi-turn conversations.

        - Context window: 192K (196608 tokens)
        - YaRN scaling from 96K native → 192K extrapolated
        - F16 KV cache for long-range precision
        - Dual-path speculative decoding (draft-mtp + n-gram fallback)

        Based on model author's recommended long-context settings, adapted for
        stock llama.cpp compatibility.

        Use the base recipe for short prompts (< 8K tokens) to get maximum
        throughput. This variant trades ~10-15 tok/s for long-context capability.
    maintainer: "@ishan5ain"
    model_params: 27B
    model_dtype: nvfp4
    kv_dtype: f16
    quantization: nvfp4
    quant_bits: 4

defaults:
    port: 8000
    host: 0.0.0.0
    ctx_size: 196608
    batch_size: 2048
    ubatch_size: 512
    kv_dtype: f16
    mtp_n: 3
    n_gpu_layers: 99
    temp: 0.15
    top_p: 0.92
    top_k: 10
    min_p: 0.05
    frequency_penalty: 1.03
    presence_penalty: 0.0
    repeat_penalty: 1.0
    parallel: 1
    spec_type: "draft-mtp"
    alias: "Qwen3.6-27B-TEXT-NVFP4-MTP"

env:
    GGML_CUDA_ENABLE_UNIFIED_MEMORY: "1"

command: |
    llama-server \
      -hf {model} \
      --host {host} \
      --port {port} \
      --alias {alias} \
      --n-gpu-layers {n_gpu_layers} \
      --ctx-size {ctx_size} \
      --batch-size {batch_size} \
      --ubatch-size {ubatch_size} \
      --flash-attn on \
      --jinja \
      --reasoning on \
      --temp {temp} \
      --top-p {top_p} \
      --top-k {top_k} \
      --min-p {min_p} \
      --frequency-penalty {frequency_penalty} \
      --presence-penalty {presence_penalty} \
      --repeat-penalty {repeat_penalty} \
      --chat-template-kwargs '{"preserve_thinking": true}' \
      --spec-type {spec_type}\
      --spec-draft-n-max {mtp_n} \
      --cont-batching \
      --parallel {parallel} \
      --mlock \
      --rope-scaling yarn \
      --yarn-orig-ctx 98304 \
      -ctk {kv_dtype} \
      -ctv {kv_dtype} \
      --swa-full
